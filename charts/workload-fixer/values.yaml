## Default values for workload-fixer.

## @section Global parameters

## @param replicaCount Number of replicas (should stay at 1 to avoid duplicate actions)
replicaCount: 1

## @section Image parameters

image:
  ## @param image.repository Container image repository
  repository: ghcr.io/enys/workload-fixer
  ## @param image.pullPolicy Image pull policy
  pullPolicy: IfNotPresent
  ## @param image.tag Overrides the image tag. Defaults to the chart appVersion.
  tag: ""

## @param imagePullSecrets List of image pull secrets
imagePullSecrets: []
## @param nameOverride Override the name of the chart
nameOverride: ""
## @param fullnameOverride Override the full name of the release
fullnameOverride: ""

## @section Service account parameters

serviceAccount:
  ## @param serviceAccount.create Specifies whether a service account should be created
  create: true
  ## @param serviceAccount.automount Automatically mount a ServiceAccount's API credentials
  automount: true
  ## @param serviceAccount.annotations Annotations to add to the service account
  annotations: {}
  ## @param serviceAccount.name The name of the service account. Generated using the fullname template if not set.
  name: ""

## @param podAnnotations Extra annotations to add to pods
podAnnotations: {}
## @param podLabels Extra labels to add to pods
podLabels: {}

## @section Security context parameters

## @param podSecurityContext Security context for pods
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

## @param securityContext Security context for the container
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

## @section Watcher configuration

watcher:
  ## @param watcher.namespace Kubernetes namespace to watch. Defaults to the release namespace.
  namespace: ""
  ## @param watcher.stuckThresholdSeconds How long (seconds) a rollout must be stuck before the fixer acts.
  stuckThresholdSeconds: 300
  ## @param watcher.pollIntervalSeconds How often (seconds) to poll the Kubernetes API.
  pollIntervalSeconds: 30
  ## @param watcher.port Port on which the health/readiness HTTP server listens.
  port: 9090

## @section RBAC

rbac:
  ## @param rbac.clusterScoped When true, create a ClusterRole + ClusterRoleBinding instead of a namespaced Role.
  ## Use this when watcher.namespace is empty and you want to watch all namespaces.
  clusterScoped: false

## @section Resource limits and requests

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 20m
    memory: 32Mi

## @section Liveness and readiness probes

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

## @param volumes Additional volumes to add to the pod
volumes: []

## @param volumeMounts Additional volume mounts for the container
volumeMounts: []

## @param nodeSelector Node selector labels
nodeSelector: {}

## @param tolerations Tolerations for pod scheduling
tolerations: []

## @param affinity Affinity rules for pod scheduling
affinity: {}
