## CI test values — minimal config for ct install
watcher:
  namespace: ""
  stuckThresholdSeconds: 60
  pollIntervalSeconds: 10
  port: 9090

# The ct install CI cluster does not have the Prometheus Operator CRDs
# installed, so ServiceMonitor/PrometheusRule resources would fail to apply.
serviceMonitor:
  enabled: false

alerts:
  enabled: false
