name: Docker image CI/CD

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/entra-app-exporter/**"
      - "charts/entra-app-exporter/**"
      - "apps/workload-fixer/**"
      - "charts/workload-fixer/**"
      - ".github/workflows/docker-image-ci.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/entra-app-exporter/**"
      - "charts/entra-app-exporter/**"
      - "apps/workload-fixer/**"
      - "charts/workload-fixer/**"
      - ".github/workflows/docker-image-ci.yml"

permissions: {}

jobs:
  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image-tags
        run: |
          tags=""

          if ([ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]) && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="ghcr.io/${{ github.repository_owner }}/entra-app-exporter:${{ github.sha }}"
          fi

          if ([ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]) && echo "${GITHUB_REF}" | grep -Eq '^refs/tags/v'; then
            semver_source="${GITHUB_REF_NAME}"
            if ! echo "${semver_source}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::Tag ${semver_source} is not a valid semver tag (expected vX.Y.Z or vX.Y.Z-rcN)."
              exit 1
            fi

            semver_image_tag="${semver_source#v}"
            if [ -n "${tags}" ]; then
              tags="${tags}"$'\n'
            fi
            tags="${tags}ghcr.io/${{ github.repository_owner }}/entra-app-exporter:${semver_image_tag}"

            # Publish latest only for stable releases.
            if ! echo "${semver_image_tag}" | grep -q '-'; then
              tags="${tags}"$'\n'"ghcr.io/${{ github.repository_owner }}/entra-app-exporter:latest"
            fi
          fi

          if [ -z "${tags}" ]; then
            tags="ghcr.io/${{ github.repository_owner }}/entra-app-exporter:${{ github.sha }}"
          fi

          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/entra-app-exporter
          file: apps/entra-app-exporter/Dockerfile
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.image-tags.outputs.tags }}

  lint-chart:
    name: Lint Helm chart (ct lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.21.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install lint dependencies
        run: pip install yamllint yamale

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          version: v3.14.0

      - name: Run ct lint
        run: ct lint --chart-dirs charts --charts charts/entra-app-exporter

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build test image (load locally)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/entra-app-exporter
          file: apps/entra-app-exporter/Dockerfile
          push: false
          load: true
          tags: entra-app-exporter:${{ github.sha }}

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Load test image into kind
        run: kind load docker-image entra-app-exporter:${{ github.sha }} --name chart-testing

      - name: Run ct install
        run: >
          ct install --chart-dirs charts --charts charts/entra-app-exporter
          --helm-extra-set-args
          "--set image.repository=entra-app-exporter --set image.tag=${{ github.sha }} --set image.pullPolicy=IfNotPresent"

  release-image:
    name: Create GitHub release for image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - build-image
      - lint-chart
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="image-${GITHUB_REF_NAME}"
          semver_tag="${GITHUB_REF_NAME#v}"
          latest_note=""
          if ! echo "${semver_tag}" | grep -q '-'; then
            latest_note=$'\n'"- ghcr.io/${{ github.repository_owner }}/entra-app-exporter:latest"
          fi
          notes=$(cat <<EOF
          Container image published to GHCR:

          - ghcr.io/${{ github.repository_owner }}/entra-app-exporter:${semver_tag}${latest_note}
          EOF
          )
          gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Image ${GITHUB_REF_NAME}" \
            --notes "$notes"

  build-image-workload-fixer:
    name: Build Docker image (workload-fixer)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image-tags
        run: |
          tags=""

          if ([ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]) && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="ghcr.io/${{ github.repository_owner }}/workload-fixer:${{ github.sha }}"
          fi

          if ([ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]) && echo "${GITHUB_REF}" | grep -Eq '^refs/tags/v'; then
            semver_source="${GITHUB_REF_NAME}"
            if ! echo "${semver_source}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::Tag ${semver_source} is not a valid semver tag (expected vX.Y.Z or vX.Y.Z-rcN)."
              exit 1
            fi

            semver_image_tag="${semver_source#v}"
            if [ -n "${tags}" ]; then
              tags="${tags}"$'\n'
            fi
            tags="${tags}ghcr.io/${{ github.repository_owner }}/workload-fixer:${semver_image_tag}"

            # Publish latest only for stable releases.
            if ! echo "${semver_image_tag}" | grep -q '-'; then
              tags="${tags}"$'\n'"ghcr.io/${{ github.repository_owner }}/workload-fixer:latest"
            fi
          fi

          if [ -z "${tags}" ]; then
            tags="ghcr.io/${{ github.repository_owner }}/workload-fixer:${{ github.sha }}"
          fi

          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: apps/workload-fixer
          file: apps/workload-fixer/Dockerfile
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.image-tags.outputs.tags }}

  lint-chart-workload-fixer:
    name: Lint Helm chart (workload-fixer)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.21.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install lint dependencies
        run: pip install yamllint yamale

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          version: v3.14.0

      - name: Run ct lint
        run: ct lint --chart-dirs charts --charts charts/workload-fixer

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build test image (load locally)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: apps/workload-fixer
          file: apps/workload-fixer/Dockerfile
          push: false
          load: true
          tags: workload-fixer:${{ github.sha }}

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Load test image into kind
        run: kind load docker-image workload-fixer:${{ github.sha }} --name chart-testing

      - name: Run ct install
        run: >
          ct install --chart-dirs charts --charts charts/workload-fixer
          --helm-extra-set-args
          "--set image.repository=workload-fixer --set image.tag=${{ github.sha }} --set image.pullPolicy=IfNotPresent"

  release-image-workload-fixer:
    name: Create GitHub release for image (workload-fixer)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - build-image-workload-fixer
      - lint-chart-workload-fixer
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="image-workload-fixer-${GITHUB_REF_NAME}"
          semver_tag="${GITHUB_REF_NAME#v}"
          latest_note=""
          if ! echo "${semver_tag}" | grep -q '-'; then
            latest_note=$'\n'"- ghcr.io/${{ github.repository_owner }}/workload-fixer:latest"
          fi
          notes=$(cat <<EOF
          Container image published to GHCR:

          - ghcr.io/${{ github.repository_owner }}/workload-fixer:${semver_tag}${latest_note}
          EOF
          )
          gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Image workload-fixer ${GITHUB_REF_NAME}" \
            --notes "$notes"
