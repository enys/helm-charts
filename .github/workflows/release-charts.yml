name: Release Helm charts

on:
  workflow_dispatch:
  push:
    tags:
      - "entra-app-exporter-v*"
      - "workload-fixer-v*"

permissions: {}

jobs:
  lint-chart:
    name: Lint Helm chart (ct lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.21.3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install lint dependencies
        run: pip install yamllint yamale

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          version: v3.14.0

      - name: Run ct lint
        run: ct lint --chart-dirs charts --charts charts/entra-app-exporter --charts charts/workload-fixer

  release-charts:
    name: Package and release charts
    runs-on: ubuntu-latest
    needs:
      - lint-chart
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run chart-releaser
        id: chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_RELEASE_NOTES_FILE: release-notes.md

      - name: Add generated changelog to releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_CHARTS: ${{ steps.chart-releaser.outputs.changed_charts }}
        run: |
          set -euo pipefail

          tmp_files=()
          trap '(( ${#tmp_files[@]} )) && rm -f "${tmp_files[@]}"' EXIT

          IFS=',' read -r -a charts <<< "${CHANGED_CHARTS}"
          for chart_dir in "${charts[@]}"; do
            [ -n "${chart_dir}" ] || continue

            chart_name="$(awk '$1 == "name:" { print $2; exit }' "${chart_dir}/Chart.yaml")"
            chart_version="$(awk '$1 == "version:" { print $2; exit }' "${chart_dir}/Chart.yaml")"
            release_tag="${chart_name}-${chart_version}"
            release_notes="$(mktemp)"
            generated_notes="$(mktemp)"
            tmp_files+=("${release_notes}" "${generated_notes}")
            gh api \
              --method POST \
              "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${release_tag}" \
              -f target_commitish="${GITHUB_SHA}" \
              --jq '.body' > "${generated_notes}"

            cat "${chart_dir}/release-notes.md" > "${release_notes}"
            printf '\n\n## Changelog\n\n' >> "${release_notes}"
            cat "${generated_notes}" >> "${release_notes}"
            gh release edit "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --notes-file "${release_notes}"
          done
